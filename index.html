<style>
  :root {
    color-scheme: light;
    --yellow: #ffbc00;   /* KB 노랑: 위쪽 띠, 전화 걸기 */
    --gray: #60584c;     /* KB 회색: 아이콘, 보조 */
    --ink: #26231f;      /* 본문 글자 */
    --sub: #6f675c;      /* 보조 글자 */
    --line: #e6e3dd;     /* 구분선 */
    --mist: #f5f4f1;     /* 아이콘 버튼 바탕 */
    --paper: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 화면에 실제로 보이는 영역에 고정 → 삼성 인터넷 등 툴바 높이 계산 차이와 무관 */
  body {
    position: fixed; inset: 0;
    overflow-x: hidden; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: var(--paper); color: var(--ink);
    font-family: "Pretendard Variable", Pretendard, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; word-break: keep-all;
  }
  button { font: inherit; color: inherit; }
  a, button { -webkit-tap-highlight-color: transparent; }
  :focus-visible { outline: 2px solid var(--gray); outline-offset: 2px; }

  /* ── 명함 한 장 = 화면 전체 ── */
  .page {
    position: relative; max-width: 480px; min-height: 100%; margin: 0 auto;
    display: flex; flex-direction: column; background: var(--paper);
  }
  .page::before { /* KB 노란 띠 */
    content: ""; display: block; height: 8px; background: var(--yellow);
    transform-origin: left; animation: sweep .6s cubic-bezier(.6, 0, .2, 1) backwards;
  }
  .content { animation: appear .6s .25s cubic-bezier(.2, .8, .2, 1) backwards; }
  @keyframes sweep { from { transform: scaleX(0); } }
  @keyframes appear { from { opacity: 0; transform: translateY(10px); } }

  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 24px 24px 0;
  }
  .logo { height: 40px; display: block; }
  .weather {
    display: flex; align-items: center; gap: 5px;
    font-size: 14px; font-weight: 500; color: var(--sub);
    font-variant-numeric: tabular-nums;
  }
  .weather[hidden] { display: none; }
  .weather svg { width: 18px; height: 18px; }

  .who { padding: 44px 24px 36px; }
  .name { font-size: 40px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
  .role { margin-top: 10px; font-size: 16px; color: var(--sub); }
  .role strong { color: var(--ink); font-weight: 600; }
  .certs { list-style: none; display: flex; align-items: center; gap: 18px; margin-top: 22px; }
  .certs img { display: block; height: 34px; width: auto; }

  /* ── 연락처: 내용 + 오른쪽 동작 아이콘 ── */
  .contacts { list-style: none; margin: 0 24px; border-top: 1px solid var(--line); }
  .contacts a {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    min-height: 68px; padding: 10px 0;
    border-bottom: 1px solid var(--line);
    color: inherit; text-decoration: none;
  }
  .value { font-size: 17px; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
  .act {
    flex: none; width: 44px; height: 44px; border-radius: 50%;
    display: grid; place-items: center;
    background: var(--mist); color: var(--gray);
    transition: background .15s, transform .15s;
  }
  .act svg { width: 20px; height: 20px; }
  .contacts a:active .act { background: var(--yellow); color: var(--ink); transform: scale(.94); }
  @media (hover: hover) { .contacts a:hover .act { background: #ece9e3; } }

  /* ── 명언: 박스 없이 조용하게 ── */
  .quote { margin: 32px 24px 28px; }
  .quote[hidden] { display: none; }
  .quote::before { content: ""; display: block; width: 24px; height: 3px; margin-bottom: 14px; background: var(--yellow); }
  .quote-msg { font-size: 14.5px; line-height: 1.7; color: var(--sub); }
  .quote-by { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 13px; color: var(--sub); }
  .quote-by b { font-weight: 600; color: var(--gray); }
  .quote-next {
    flex: none; width: 36px; height: 36px; margin-right: -8px; border: 0; border-radius: 50%;
    display: grid; place-items: center; background: none; color: var(--sub); cursor: pointer;
  }
  .quote-next:active { background: var(--mist); }
  .quote-next svg { width: 16px; height: 16px; }
  .quote-next.spin svg { animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .quote-msg, .quote-by > span { transition: opacity .25s; }
  .quote.swap .quote-msg, .quote.swap .quote-by > span { opacity: 0; }

  /* ── 아래 고정 버튼 줄 (엄지 닿는 곳) ── */
  .bar {
    position: sticky; bottom: 0; margin-top: auto;
    display: flex; gap: 10px;
    padding: 12px 24px calc(12px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, .94); border-top: 1px solid var(--line);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    animation: appear .6s .35s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  .call, .icon-btn {
    height: 54px; border-radius: 14px; border: 0; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    text-decoration: none; transition: transform .15s, filter .15s;
  }
  .call { flex: 1; gap: 8px; background: var(--yellow); color: var(--ink); font-size: 17px; font-weight: 700; }
  .icon-btn { flex: none; width: 54px; background: var(--mist); color: var(--gray); }
  .call svg { width: 20px; height: 20px; }
  .icon-btn svg { width: 22px; height: 22px; }
  .call:active, .icon-btn:active { transform: scale(.96); filter: brightness(.95); }

  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 30;
    transform: translate(-50%, 12px); opacity: 0; transition: .25s; pointer-events: none;
    background: var(--ink); color: #fff; font-size: 14px; padding: 10px 18px; border-radius: 999px;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* ── 공유 시트 ── */
  .sheet-bg { position: fixed; inset: 0; z-index: 20; background: rgba(20, 16, 10, .45); opacity: 0; transition: opacity .25s; }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 21;
    width: 100%; max-width: 480px; transform: translate(-50%, 100%);
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
    background: var(--paper); border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, .15);
    transition: transform .35s cubic-bezier(.2, .9, .25, 1);
  }
  .share-open .sheet-bg { opacity: 1; }
  .share-open .sheet { transform: translate(-50%, 0); }
  .sheet[hidden], .sheet-bg[hidden] { display: none; }
  .sheet-grip { width: 40px; height: 4px; margin: 0 auto 14px; border-radius: 2px; background: var(--line); }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .sheet-head h2 { font-size: 17px; font-weight: 700; }
  .sheet-close { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--mist); color: var(--gray); cursor: pointer; display: grid; place-items: center; }
  .sheet-close svg { width: 18px; height: 18px; }
  .share-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .share-item {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    border: 0; background: none; cursor: pointer; text-decoration: none;
    color: var(--ink); font-size: 12.5px;
  }
  .share-ico {
    width: 52px; height: 52px; border-radius: 16px;
    display: grid; place-items: center; color: #fff;
    font: 700 22px system-ui, sans-serif; transition: transform .15s;
  }
  .share-item:active .share-ico { transform: scale(.92); }
  .share-ico svg { width: 22px; height: 22px; }

  /* 넓은 화면(PC)에서는 가운데 한 장으로 */
  @media (min-width: 600px) {
    body { background: var(--mist); padding: 40px 16px; }
    .page { min-height: 0; border-radius: 24px; overflow: clip; box-shadow: 0 1px 0 var(--line), 0 20px 50px rgba(38, 35, 31, .10); }
    .bar { position: static; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <main class="page">
    <div class="content">
      <header class="top">
        <img class="logo" src="kb_logo.png" alt="KB국민은행">
        <div class="weather" id="weather" role="img" hidden><span id="weatherIco" aria-hidden="true"></span><span id="weatherTemp" aria-hidden="true"></span></div>

            <span class="act" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>

          <a href="https://map.naver.com/p/search/경기 시흥시 장현능곡로 155" target="_blank" rel="noopener" aria-label="지도에서 보기 경기 시흥시 장현능곡로 155, 1층">

        </figcaption>
      </figure>
    </div>

    <nav class="bar" aria-label="빠른 동작">
      <a class="call" href="tel:01030089888"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>전화 걸기</a>
      <button class="icon-btn" id="save" aria-label="연락처 저장" title="연락처 저장"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></button>

  <div class="toast" id="toast" role="status"></div>

      <h2 id="sheetTitle">명함 공유</h2>
      <button class="sheet-close" id="sheetClose" aria-label="닫기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="share-grid" id="shareGrid"></div>
  </section>

<script>
  const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
  const toast = msg => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  };

  // ── 연락처 저장 (vCard) ──
  document.getElementById('save').onclick = () => {
    const name = document.getElementById('name').textContent.trim();
    const vcf = [
      'BEGIN:VCARD', 'VERSION:3.0',
      'FN:' + name, 'N:' + name + ';;;;',
      'ORG:KB국민은행;시흥능곡지점', 'TITLE:VIP팀장',
      'NOTE:보유 자격 CFP\\, AFPK\\, ARPS',
      'TEL;TYPE=CELL:010-3008-9888',
      'EMAIL;TYPE=WORK:1907598@kbfg.com',
      'ADR;TYPE=WORK:;;장현능곡로 155, 1층;시흥시;경기도;;대한민국',
      'END:VCARD'
    ].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard;charset=utf-8' }));
    a.download = name + '_KB국민은행_시흥능곡지점.vcf';
    a.click();
    URL.revokeObjectURL(a.href);
    toast('연락처 파일을 저장했습니다');
  };

  // ── 날씨: Open-Meteo, 지점 위치(시흥 능곡) 기준. 기기마다 다른 이모지 대신 선 아이콘 ──
  const CLOUD = '<path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4.5 4.5 0 0 1 0 9z"/>';
  const RAINCLOUD = '<path d="M4 14.9A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 2.5 8.2"/>';
  const weatherIcon = (code, day) => {
    if (code === 0) return day
      ? ['<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>', '맑음']
      : ['<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>', '맑음'];
    if (code <= 2) return ['<path d="M12 2v2M4.9 4.9l1.4 1.4M20 12h2M19.1 4.9l-1.4 1.4"/><path d="M15.9 12.6a4 4 0 0 0-5.9-4.1"/><path d="M13 22H7a5 5 0 1 1 4.9-6H13a3 3 0 0 1 0 6z"/>', '구름 조금'];
    if (code === 3) return [CLOUD, '흐림'];
    if (code <= 48) return ['<path d="M4 10h16M4 14h16M6 18h12M8 6h8"/>', '안개'];
    if (code <= 67 || (code >= 80 && code <= 82)) return [RAINCLOUD + '<path d="M16 14v6M8 14v6M12 16v6"/>', '비'];
    if (code <= 77 || code === 85 || code === 86) return [RAINCLOUD + '<path d="M8 15h.01M8 19h.01M12 17h.01M12 21h.01M16 15h.01M16 19h.01"/>', '눈'];
    return ['<path d="M6 16.3A7 7 0 1 1 15.7 8h1.8a4.5 4.5 0 0 1 1.5 8.7"/><path d="m13 12-3 5h4l-3 5"/>', '뇌우'];
  };
  (async () => {
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.37&longitude=126.81&current=temperature_2m,weather_code,is_day&timezone=Asia%2FSeoul');
      if (!res.ok) throw new Error(res.status);
      const c = (await res.json()).current;
      const [paths, desc] = weatherIcon(c.weather_code, c.is_day === 1);
      const temp = Math.round(c.temperature_2m) + '°';
      document.getElementById('weatherIco').innerHTML = svg(paths); // 위에 정의한 고정 문자열만 사용
      document.getElementById('weatherTemp').textContent = temp;
      const w = document.getElementById('weather');
      w.setAttribute('aria-label', '시흥 지금 날씨 ' + desc + ', ' + temp);
      w.hidden = false;
    } catch (e) {
      // 날씨를 불러오지 못하면 표시하지 않음
    }
  })();

  // ── 명언 ──
  const quoteNext = document.getElementById('quoteNext');
  const loadQuote = async () => {
    quoteNext.classList.add('spin');
    try {
      const res = await fetch('https://kradvice-pitca.vercel.app/api/advice', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const q = await res.json();
      if (!q.message) throw new Error('empty');
      const box = document.getElementById('quote');
      if (!box.hidden) {
        box.classList.add('swap');
        await new Promise(r => setTimeout(r, 250));
      }
      document.getElementById('quoteMsg').textContent = q.message;
      document.getElementById('quoteAuthor').textContent = q.author || '작자 미상';
      document.getElementById('quoteProfile').textContent = q.authorProfile ? ' (' + q.authorProfile + ')' : '';
      box.hidden = false;
      box.classList.remove('swap');
    } catch (e) {
      // 명언을 불러오지 못하면 영역을 숨긴 채 명함만 보여줌
    } finally {
      quoteNext.classList.remove('spin');
    }
  };
  quoteNext.onclick = loadQuote;
  loadQuote();

  // ── 공유 시트: 별도 앱 등록 없이 링크만으로 동작하는 공유처 ──
  (() => {
    const pageUrl = location.origin + location.pathname; // ?v= 같은 꼬리표 제거
    const text = '나윤정 VIP팀장 (KB국민은행 시흥능곡지점) 명함';
    const u = encodeURIComponent(pageUrl), t = encodeURIComponent(text), tu = encodeURIComponent(text + '\n' + pageUrl);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    const copy = async () => {
      try { await navigator.clipboard.writeText(pageUrl); }
      catch (e) { // 구형 브라우저 대비
        const ta = Object.assign(document.createElement('textarea'), { value: pageUrl });
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove();
        if (!ok) { toast('링크를 복사하지 못했습니다. 주소창의 링크를 길게 눌러 복사해 주세요'); return; }
      }
      close(); toast('링크를 복사했습니다');
    };

    const items = [
      { name: '문자', bg: '#ffbc00', fg: '#26231f', ico: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'), href: (isIOS ? 'sms:&body=' : 'sms:?body=') + tu },
      { name: '밴드', bg: '#00c73c', ico: 'b', href: 'https://band.us/plugin/share?body=' + tu + '&route=' + u, ext: 1 },
      { name: '이메일', bg: '#60584c', ico: svg('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>'), href: 'mailto:?subject=' + t + '&body=' + tu },
      { name: '링크 복사', bg: '#ece9e3', fg: '#60584c', ico: svg('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'), action: copy },
    ];
    if (navigator.share) items.push({
      name: '더보기', bg: '#f5f4f1', fg: '#60584c',
      ico: svg('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
      action: async () => { close(); try { await navigator.share({ title: text, text, url: pageUrl }); } catch (e) {} }
    });

    const grid = document.getElementById('shareGrid');
    items.forEach(it => {
      const el = document.createElement(it.href ? 'a' : 'button');
      el.className = 'share-item';
      if (it.href) { el.href = it.href; if (it.ext) { el.target = '_blank'; el.rel = 'noopener'; } el.addEventListener('click', () => close()); }
      else { el.type = 'button'; el.addEventListener('click', it.action); }
      const ico = document.createElement('span');
      ico.className = 'share-ico'; ico.style.background = it.bg; ico.style.color = it.fg || '#fff';
      ico.innerHTML = it.ico; // 위에서 직접 정의한 고정 문자열만 사용
      const label = document.createElement('span'); label.textContent = it.name;
      el.append(ico, label); grid.appendChild(el);
    });

    const sheet = document.getElementById('sheet'), bg = document.getElementById('sheetBg');
    const shareBtn = document.getElementById('share');
    let hideTimer;
    const open = () => {
      clearTimeout(hideTimer);
      sheet.hidden = bg.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('share-open')));
      document.getElementById('sheetClose').focus({ preventScroll: true });
    };
    function close() {
      if (sheet.hidden) return;
      document.body.classList.remove('share-open');
      hideTimer = setTimeout(() => { sheet.hidden = bg.hidden = true; }, 300);
      shareBtn.focus({ preventScroll: true });
    }
    shareBtn.onclick = open;
    bg.onclick = close;
    document.getElementById('sheetClose').onclick = close;
    addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  })();
</script>
</body>
</html>
