<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나윤정 팀장 명함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f1ec;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #7a7266;
    --line: #ebe6dd;
    --kb-yellow: #ffbc00;
    --kb-gray: #60584c;
    --chip: #faf7f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1815; --card: #f9f8f5; --ink: #2b2620; --muted: #7a7266;
      --line: #ebe6dd; --chip: #f3efe6;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* 화면에 실제로 보이는 영역에 고정 → 삼성 인터넷 등 툴바 높이 계산 차이와 무관하게 중앙 정렬 */
  body {
    position: fixed; inset: 0; overflow-x: hidden;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: flex;
    padding: 24px 16px;
    background: var(--bg);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
  }
  .card {
    width: 100%; max-width: 420px;
    margin: auto; /* 가로·세로 중앙, 화면보다 길면 위에서부터 스크롤 */
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(40, 30, 10, .12);
    overflow: hidden;
  }
  .top {
    position: relative;
    padding: 32px 28px 26px;
    border-bottom: 1px solid var(--line);
  }
  .top::before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 6px;
    background: var(--kb-yellow);
  }
  .weather {
    position: absolute; top: 30px; right: 28px; height: 40px;
    display: flex; align-items: center; gap: 4px;
    font-size: 17px; font-weight: 500; color: var(--kb-gray);
  }
  .weather[hidden] { display: none; }
  .weather-ico { font-size: 24px; line-height: 1; }
  .logo { height: 40px; display: block; margin-bottom: 30px; }
  .name { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .title { margin-top: 6px; font-size: 15px; color: var(--muted); }
  .title b { color: var(--kb-gray); font-weight: 500; }

  .info { list-style: none; padding: 10px 16px; }
  .info a {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 12px; border-radius: 12px;
    color: inherit; text-decoration: none;
    transition: background .15s;
  }
  .info a:hover, .info a:focus-visible { background: var(--chip); outline: none; }
  .ico {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: #fff4d1; color: var(--kb-gray);
  }
  .ico svg { width: 18px; height: 18px; }
  .label { font-size: 12px; color: var(--muted); }
  .value { font-size: 15px; font-weight: 500; word-break: keep-all; overflow-wrap: anywhere; }

  .quote {
    position: relative; margin: 4px 28px 20px; padding: 18px 20px 16px;
    background: var(--chip); border-radius: 14px;
    border-left: 4px solid var(--kb-yellow);
  }
  .quote[hidden] { display: none; }
  .quote-msg { font-size: 15px; line-height: 1.6; word-break: keep-all; padding-right: 28px; }
  .quote-by { margin-top: 10px; font-size: 13px; color: var(--kb-gray); font-weight: 500; }
  .quote-by small { font-size: 12px; color: var(--muted); font-weight: 400; }
  .quote-next {
    position: absolute; top: 12px; right: 12px;
    width: 30px; height: 30px; border: 0; border-radius: 50%;
    display: grid; place-items: center; cursor: pointer;
    background: transparent; color: var(--muted);
  }
  .quote-next:hover { background: #fff4d1; color: var(--kb-gray); }
  .quote-next svg { width: 16px; height: 16px; }
  .quote-next.spin svg { animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .actions { display: flex; gap: 10px; padding: 6px 28px 28px; }

  /* ── 키네틱 효과 ── */
  .card {
    position: relative;
    --rx: 0deg; --ry: 0deg; --mx: 50%; --my: 0%; --glow: 0;
    transform: perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));
    will-change: transform;
    animation: card-in .8s cubic-bezier(.2, .8, .2, 1) backwards;
  }
  .card::after { /* 기울기를 따라 움직이는 빛 반사 */
    content: ""; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(circle at var(--mx) var(--my), rgba(255, 255, 255, .55), transparent 55%);
    opacity: var(--glow); mix-blend-mode: soft-light; transition: opacity .4s;
  }
  @keyframes card-in { from { opacity: 0; transform: perspective(900px) translateY(40px) rotateX(12deg) scale(.95); } }

  .reveal { animation: rise .6s cubic-bezier(.2, .8, .2, 1) backwards; animation-delay: calc(.25s + var(--i, 0) * .08s); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .top::before { transform-origin: left; animation: bar .7s .15s cubic-bezier(.6, 0, .2, 1) backwards; }
  @keyframes bar { from { transform: scaleX(0); } }

  .weather-ico { display: inline-block; animation: bob 3.2s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-3px) rotate(-6deg); } }

  .ico { transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); }
  .info a:hover .ico, .info a:active .ico { transform: scale(1.12) rotate(-8deg); }
  .btn { transition: transform .18s cubic-bezier(.3, 1.6, .5, 1), filter .15s; }
  .btn:active { transform: scale(.95); }

  .quote-msg, .quote-by { transition: opacity .25s, transform .25s; }
  .quote.swap .quote-msg, .quote.swap .quote-by { opacity: 0; transform: translateY(6px); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card { transform: none !important; }
    .card::after { display: none; }
  }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 46px; border-radius: 12px; border: 0; cursor: pointer;
    font: 500 14px "Noto Sans KR", sans-serif; text-decoration: none;
  }
  .btn svg { width: 16px; height: 16px; flex: none; }
  .btn.primary { background: var(--kb-yellow); color: #2b2620; }
  .btn.ghost { background: var(--chip); color: var(--kb-gray); }
  .btn:hover { filter: brightness(.96); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #2b2620; color: #fff; font-size: 14px;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast { z-index: 30; }

  /* ── 공유 시트 ── */
  .sheet-bg {
    position: fixed; inset: 0; z-index: 20;
    background: rgba(20, 16, 10, .45); opacity: 0; transition: opacity .25s;
  }
  .sheet {
    position: fixed; left: 50%; bottom: 0; z-index: 21;
    width: 100%; max-width: 460px; transform: translate(-50%, 100%);
    padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
    background: #fff; color: #2b2620; border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 40px rgba(0, 0, 0, .15);
    transition: transform .35s cubic-bezier(.2, .9, .25, 1.1);
  }
  .share-open .sheet-bg { opacity: 1; }
  .share-open .sheet { transform: translate(-50%, 0); }
  .sheet[hidden], .sheet-bg[hidden] { display: none; }
  .sheet-grip { width: 40px; height: 4px; margin: 0 auto 14px; border-radius: 2px; background: #e2ddd3; }
  .sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .sheet-head h2 { font-size: 17px; font-weight: 700; }
  .sheet-close { width: 32px; height: 32px; border: 0; border-radius: 50%; background: #f3efe6; color: #60584c; font-size: 18px; cursor: pointer; }
  .share-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 16px 6px; }
  .share-item {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    border: 0; background: none; cursor: pointer; text-decoration: none;
    color: #2b2620; font: 400 12px "Noto Sans KR", sans-serif; word-break: keep-all;
    opacity: 0; transform: translateY(12px);
    transition: opacity .3s, transform .35s cubic-bezier(.3, 1.5, .5, 1);
    transition-delay: calc(var(--i) * .03s);
  }
  .share-open .share-item { opacity: 1; transform: none; }
  .share-ico {
    width: 50px; height: 50px; border-radius: 16px;
    display: grid; place-items: center; color: #fff;
    font: 700 21px system-ui, sans-serif; letter-spacing: -.3px;
    transition: transform .2s cubic-bezier(.3, 1.6, .5, 1);
  }
  .share-item:hover .share-ico, .share-item:focus-visible .share-ico { transform: translateY(-3px); }
  .share-item:active .share-ico { transform: scale(.9); }
  .share-ico svg { width: 22px; height: 22px; }
</style>
</head>
<body>
  <main class="card">
    <section class="top">
      <div class="weather reveal" style="--i:1" id="weather" hidden><span class="weather-ico" id="weatherIco"></span><span id="weatherTemp"></span></div>
      <img class="logo reveal" style="--i:0" src="kb_logo.png" alt="KB국민은행">
      <h1 class="name reveal" style="--i:1" id="name">나윤정</h1>
      <p class="title reveal" style="--i:2"><b>팀장</b> · 국민은행</p>
    </section>

    <ul class="info">
      <li class="reveal" style="--i:3">
        <a href="tel:01030089888">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <span><span class="label">휴대전화</span><br><span class="value">010-3008-9888</span></span>
        </a>
      </li>
      <li class="reveal" style="--i:4">
        <a href="mailto:1907598@kbfg.com">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
          <span><span class="label">이메일</span><br><span class="value">1907598@kbfg.com</span></span>
        </a>
      </li>
      <li class="reveal" style="--i:5">
        <a href="https://map.naver.com/p/search/경기 시흥시 장현능곡로 155" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
          <span><span class="label">주소</span><br><span class="value">경기 시흥시 장현능곡로 155, 1층</span></span>
        </a>
      </li>
    </ul>

    <figure class="quote reveal" style="--i:6" id="quote" hidden>
      <button class="quote-next" id="quoteNext" aria-label="다른 명언 보기"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/></svg></button>
      <blockquote class="quote-msg" id="quoteMsg"></blockquote>
      <figcaption class="quote-by">— <span id="quoteAuthor"></span><small id="quoteProfile"></small></figcaption>
    </figure>

    <div class="actions reveal" style="--i:7">
      <button class="btn primary" id="save"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>연락처 저장</button>
      <button class="btn ghost" id="share">명함 공유</button>
    </div>
  </main>
  <div class="toast" id="toast"></div>

  <div class="sheet-bg" id="sheetBg" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-grip"></div>
    <div class="sheet-head">
      <h2 id="sheetTitle">명함 공유하기</h2>
      <button class="sheet-close" id="sheetClose" aria-label="닫기">✕</button>
    </div>
    <div class="share-grid" id="shareGrid"></div>
  </section>

<script>
  const toast = msg => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  };

  document.getElementById('save').onclick = () => {
    const name = document.getElementById('name').textContent.trim();
    const vcf = [
      'BEGIN:VCARD', 'VERSION:3.0',
      'FN:' + name, 'N:' + name + ';;;;',
      'ORG:국민은행', 'TITLE:팀장',
      'TEL;TYPE=CELL:010-3008-9888',
      'EMAIL;TYPE=WORK:1907598@kbfg.com',
      'ADR;TYPE=WORK:;;장현능곡로 155, 1층;시흥시;경기도;;대한민국',
      'END:VCARD'
    ].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard;charset=utf-8' }));
    a.download = name + '_국민은행.vcf';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  // 날씨: Open-Meteo, 명함 주소(경기 시흥시 장현능곡로) 기준
  const weatherIcon = (code, day) => {
    if (code === 0) return [day ? '☀️' : '🌙', '맑음'];
    if (code <= 2) return [day ? '🌤️' : '☁️', '구름 조금'];
    if (code === 3) return ['☁️', '흐림'];
    if (code <= 48) return ['🌫️', '안개'];
    if (code <= 67 || (code >= 80 && code <= 82)) return ['🌧️', '비'];
    if (code <= 77 || code === 85 || code === 86) return ['❄️', '눈'];
    return ['⛈️', '뇌우'];
  };
  (async () => {
    try {
      const res = await fetch('https://api.open-meteo.com/v1/forecast?latitude=37.37&longitude=126.81&current=temperature_2m,weather_code,is_day&timezone=Asia%2FSeoul');
      if (!res.ok) throw new Error(res.status);
      const c = (await res.json()).current;
      const [ico, desc] = weatherIcon(c.weather_code, c.is_day === 1);
      const temp = Math.round(c.temperature_2m) + '°';
      document.getElementById('weatherIco').textContent = ico;
      document.getElementById('weatherTemp').textContent = temp;
      const w = document.getElementById('weather');
      w.setAttribute('aria-label', '시흥 날씨 ' + desc + ' ' + temp);
      w.hidden = false;
    } catch (e) {
      // 날씨를 불러오지 못하면 표시하지 않음
    }
  })();

  const quoteNext = document.getElementById('quoteNext');
  const loadQuote = async () => {
    quoteNext.classList.add('spin');
    try {
      const res = await fetch('https://kradvice-pitca.vercel.app/api/advice', { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const q = await res.json();
      if (!q.message) throw new Error('empty');
      const box = document.getElementById('quote');
      if (!box.hidden) { // 바뀔 때 살짝 사라졌다 나타나기
        box.classList.add('swap');
        await new Promise(r => setTimeout(r, 250));
      }
      document.getElementById('quoteMsg').textContent = q.message;
      document.getElementById('quoteAuthor').textContent = q.author || '작자 미상';
      document.getElementById('quoteProfile').textContent = q.authorProfile ? ' (' + q.authorProfile + ')' : '';
      box.hidden = false;
      box.classList.remove('swap');
    } catch (e) {
      // 명언을 불러오지 못하면 영역을 숨긴 채 명함만 보여줌
    } finally {
      quoteNext.classList.remove('spin');
    }
  };
  quoteNext.onclick = loadQuote;
  loadQuote();

  // 3D 기울기: 마우스·터치 위치 또는 휴대폰 기울기를 따라 카드가 부드럽게 움직임
  (() => {
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const card = document.querySelector('.card');
    const MAX = 8; // 최대 기울기(도)
    let tx = 0, ty = 0, cx = 0, cy = 0, glow = 0, tglow = 0, running = false, base = null;

    const set = (x, y, g) => { tx = Math.max(-1, Math.min(1, x)); ty = Math.max(-1, Math.min(1, y)); tglow = g; kick(); };
    const kick = () => { if (!running) { running = true; requestAnimationFrame(step); } };
    const step = () => {
      cx += (tx - cx) * .12; cy += (ty - cy) * .12; glow += (tglow - glow) * .12; // 스프링처럼 따라감
      card.style.setProperty('--ry', (cx * MAX).toFixed(2) + 'deg');
      card.style.setProperty('--rx', (-cy * MAX).toFixed(2) + 'deg');
      card.style.setProperty('--mx', (50 + cx * 50).toFixed(1) + '%');
      card.style.setProperty('--my', (50 + cy * 50).toFixed(1) + '%');
      card.style.setProperty('--glow', glow.toFixed(3));
      if (Math.abs(tx - cx) + Math.abs(ty - cy) + Math.abs(tglow - glow) > .002) requestAnimationFrame(step);
      else running = false;
    };

    const fromPointer = e => {
      const r = card.getBoundingClientRect();
      set(((e.clientX - r.left) / r.width - .5) * 2, ((e.clientY - r.top) / r.height - .5) * 2, 1);
    };
    card.addEventListener('pointermove', fromPointer);
    card.addEventListener('pointerdown', fromPointer);
    const reset = () => set(0, 0, 0);
    card.addEventListener('pointerleave', reset);
    card.addEventListener('pointercancel', reset); // 터치 스크롤로 넘어갈 때
    card.addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') reset(); });

    // 휴대폰 기울기(권한 요청이 필요 없는 안드로이드 등에서 동작)
    addEventListener('deviceorientation', e => {
      if (e.beta == null || e.gamma == null) return;
      if (!base) base = { b: e.beta, g: e.gamma }; // 처음 잡은 자세를 기준으로
      set((e.gamma - base.g) / 20, (e.beta - base.b) / 20, .7);
    });
  })();

  // ── 공유 시트: 별도 앱 등록 없이 링크만으로 동작하는 공유처 ──
  (() => {
    const pageUrl = location.origin + location.pathname; // ?v= 같은 꼬리표 제거
    const text = '나윤정 팀장 · KB국민은행 명함';
    const u = encodeURIComponent(pageUrl), t = encodeURIComponent(text), tu = encodeURIComponent(text + '\n' + pageUrl);
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';

    const copy = async () => {
      try { await navigator.clipboard.writeText(pageUrl); }
      catch (e) { // 구형 브라우저 대비
        const ta = Object.assign(document.createElement('textarea'), { value: pageUrl });
        document.body.appendChild(ta); ta.select();
        const ok = document.execCommand('copy'); ta.remove();
        if (!ok) { toast('링크 복사에 실패했습니다'); return; }
      }
      close(); toast('링크가 복사되었습니다');
    };

    const items = [
      { name: '문자', bg: '#ffbc00', fg: '#2b2620', ico: svg('<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/>'), href: (isIOS ? 'sms:&body=' : 'sms:?body=') + tu },
      { name: '이메일', bg: '#60584c', ico: svg('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/>'), href: 'mailto:?subject=' + t + '&body=' + tu },
      { name: '밴드', bg: '#00c73c', ico: 'b', href: 'https://band.us/plugin/share?body=' + tu + '&route=' + u, ext: 1 },
      { name: '라인', bg: '#06c755', ico: 'LINE', small: 1, href: 'https://social-plugins.line.me/lineit/share?url=' + u, ext: 1 },
      { name: '페이스북', bg: '#1877f2', ico: 'f', href: 'https://www.facebook.com/sharer/sharer.php?u=' + u, ext: 1 },
      { name: 'X', bg: '#111', ico: 'X', href: 'https://twitter.com/intent/tweet?text=' + t + '&url=' + u, ext: 1 },
      { name: '링크드인', bg: '#0a66c2', ico: 'in', href: 'https://www.linkedin.com/sharing/share-offsite/?url=' + u, ext: 1 },
      { name: '텔레그램', bg: '#229ed9', ico: svg('<path d="m22 3-20 8 7 3 3 7 3-5 5 4z"/><path d="m9 14 6-5"/>'), href: 'https://t.me/share/url?url=' + u + '&text=' + t, ext: 1 },
      { name: '링크 복사', bg: '#ebe6dd', fg: '#60584c', ico: svg('<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>'), action: copy },
    ];
    if (navigator.share) items.push({
      name: '더보기', bg: '#f3efe6', fg: '#60584c',
      ico: svg('<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>'),
      action: async () => { close(); try { await navigator.share({ title: text, text, url: pageUrl }); } catch (e) {} }
    });

    const grid = document.getElementById('shareGrid');
    items.forEach((it, i) => {
      const el = document.createElement(it.href ? 'a' : 'button');
      el.className = 'share-item'; el.style.setProperty('--i', i);
      if (it.href) { el.href = it.href; if (it.ext) { el.target = '_blank'; el.rel = 'noopener'; } el.addEventListener('click', () => close()); }
      else { el.type = 'button'; el.addEventListener('click', it.action); }
      const ico = document.createElement('span');
      ico.className = 'share-ico'; ico.style.background = it.bg; ico.style.color = it.fg || '#fff';
      if (it.small) ico.style.fontSize = '12px';
      ico.innerHTML = it.ico; // 위에서 직접 정의한 고정 문자열만 사용
      const label = document.createElement('span'); label.textContent = it.name;
      el.append(ico, label); grid.appendChild(el);
    });

    const sheet = document.getElementById('sheet'), bg = document.getElementById('sheetBg');
    const shareBtn = document.getElementById('share');
    let hideTimer;
    const open = () => {
      clearTimeout(hideTimer);
      sheet.hidden = bg.hidden = false;
      requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.add('share-open')));
      document.getElementById('sheetClose').focus({ preventScroll: true });
    };
    function close() {
      if (sheet.hidden) return;
      document.body.classList.remove('share-open');
      hideTimer = setTimeout(() => { sheet.hidden = bg.hidden = true; }, 300);
      shareBtn.focus({ preventScroll: true });
    }
    shareBtn.onclick = open;
    bg.onclick = close;
    document.getElementById('sheetClose').onclick = close;
    addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  })();
</script>
</body>
</html>
