<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나윤정 팀장 명함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f1ec;
    --card: #ffffff;
    --ink: #2b2620;
    --muted: #7a7266;
    --line: #ebe6dd;
    --kb-yellow: #ffbc00;
    --kb-gray: #60584c;
    --chip: #faf7f0;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1a1815; --card: #f9f8f5; --ink: #2b2620; --muted: #7a7266;
      --line: #ebe6dd; --chip: #f3efe6;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    min-height: 100dvh; /* 모바일 주소창을 제외한 실제 보이는 높이 */
    display: flex; align-items: center; justify-content: center;
    padding: 24px 16px;
    background: var(--bg);
    font-family: "Noto Sans KR", system-ui, sans-serif;
    color: var(--ink);
  }
  .card {
    width: 100%; max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 12px 40px rgba(40, 30, 10, .12);
    overflow: hidden;
  }
  .top {
    position: relative;
    padding: 32px 28px 26px;
    border-bottom: 1px solid var(--line);
  }
  .top::before {
    content: ""; position: absolute; left: 0; top: 0; right: 0; height: 6px;
    background: var(--kb-yellow);
  }
  .logo { height: 40px; display: block; margin-bottom: 30px; }
  .name { font-size: 28px; font-weight: 700; letter-spacing: -.5px; }
  .title { margin-top: 6px; font-size: 15px; color: var(--muted); }
  .title b { color: var(--kb-gray); font-weight: 500; }

  .info { list-style: none; padding: 10px 16px; }
  .info a {
    display: flex; align-items: center; gap: 14px;
    padding: 13px 12px; border-radius: 12px;
    color: inherit; text-decoration: none;
    transition: background .15s;
  }
  .info a:hover, .info a:focus-visible { background: var(--chip); outline: none; }
  .ico {
    flex: none; width: 38px; height: 38px; border-radius: 50%;
    display: grid; place-items: center;
    background: #fff4d1; color: var(--kb-gray);
  }
  .ico svg { width: 18px; height: 18px; }
  .label { font-size: 12px; color: var(--muted); }
  .value { font-size: 15px; font-weight: 500; word-break: keep-all; overflow-wrap: anywhere; }

  .actions { display: flex; gap: 10px; padding: 6px 28px 28px; }
  .btn {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
    height: 46px; border-radius: 12px; border: 0; cursor: pointer;
    font: 500 14px "Noto Sans KR", sans-serif; text-decoration: none;
  }
  .btn.primary { background: var(--kb-yellow); color: #2b2620; }
  .btn.ghost { background: var(--chip); color: var(--kb-gray); }
  .btn:hover { filter: brightness(.96); }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #2b2620; color: #fff; font-size: 14px;
    padding: 10px 18px; border-radius: 999px; opacity: 0; transition: .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>
  <main class="card">
    <section class="top">
      <img class="logo" src="kb_logo.png" alt="KB국민은행">
      <h1 class="name" id="name">나윤정</h1>
      <p class="title"><b>팀장</b> · 국민은행</p>
    </section>

    <ul class="info">
      <li>
        <a href="tel:01030089888">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>
          <span><span class="label">휴대전화</span><br><span class="value">010-3008-9888</span></span>
        </a>
      </li>
      <li>
        <a href="mailto:1907598@kbfg.com">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></span>
          <span><span class="label">이메일</span><br><span class="value">1907598@kbfg.com</span></span>
        </a>
      </li>
      <li>
        <a href="https://map.naver.com/p/search/경기 시흥시 장현능곡로 155" target="_blank" rel="noopener">
          <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg></span>
          <span><span class="label">주소</span><br><span class="value">경기 시흥시 장현능곡로 155, 1층</span></span>
        </a>
      </li>
    </ul>

    <div class="actions">
      <button class="btn primary" id="save">연락처 저장</button>
      <button class="btn ghost" id="share">명함 공유</button>
    </div>
  </main>
  <div class="toast" id="toast"></div>

<script>
  const toast = msg => {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  };

  document.getElementById('save').onclick = () => {
    const name = document.getElementById('name').textContent.trim();
    const vcf = [
      'BEGIN:VCARD', 'VERSION:3.0',
      'FN:' + name, 'N:' + name + ';;;;',
      'ORG:국민은행', 'TITLE:팀장',
      'TEL;TYPE=CELL:010-3008-9888',
      'EMAIL;TYPE=WORK:1907598@kbfg.com',
      'ADR;TYPE=WORK:;;장현능곡로 155, 1층;시흥시;경기도;;대한민국',
      'END:VCARD'
    ].join('\r\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([vcf], { type: 'text/vcard;charset=utf-8' }));
    a.download = name + '_국민은행.vcf';
    a.click();
    URL.revokeObjectURL(a.href);
  };

  document.getElementById('share').onclick = async () => {
    const url = location.href;
    if (navigator.share) {
      try { await navigator.share({ title: document.title, url }); } catch (e) {}
    } else {
      try { await navigator.clipboard.writeText(url); toast('링크가 복사되었습니다'); }
      catch (e) { toast('링크 복사에 실패했습니다'); }
    }
  };
</script>
</body>
</html>
